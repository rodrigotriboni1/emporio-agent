name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 3.12 comes from .python-version, installed by uv during `uv sync`.
      - uses: astral-sh/setup-uv@v6
      - run: factory/checks.sh
